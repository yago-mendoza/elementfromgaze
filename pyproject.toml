[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "elementfromgaze"
version = "0.1.0"
description = "Point at things with your eyes, using only the laptop webcam: the pointer snaps to any app's buttons, a long blink clicks."
readme = "README.md"
license = "MIT"
authors = [{ name = "Yago Mendoza" }]
keywords = ["eye tracking", "gaze estimation", "webcam", "mediapipe", "accessibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "mediapipe>=0.10.30",
  "opencv-python>=4.9",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "scipy",
  "torch",
  "Pillow",
  "pystray",
  "comtypes; sys_platform == 'win32'",
  "winrt-runtime; sys_platform == 'win32'",
  "winrt-Windows.Media.Capture; sys_platform == 'win32'",
  "winrt-Windows.Media.Capture.Frames; sys_platform == 'win32'",
  "winrt-Windows.Graphics.Imaging; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
  "winrt-Windows.Foundation; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://infraphysics.net"
Repository = "https://github.com/yago-mendoza/elementfromgaze"

[project.scripts]
efg = "elementfromgaze.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elementfromgaze = ["web/*"]
